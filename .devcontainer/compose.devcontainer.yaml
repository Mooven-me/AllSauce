---
# Dev Container-specific overrides: enable XDebug
services:
  php:
    build:
      target: frankenphp_devcontainer
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-develop,debug}"
      XDEBUG_CONFIG: "client_host=127.0.0.1 start_with_request=yes"
    volumes:
      - agy_config:/root/.gemini
      - jb_config:/root/.config/JetBrains # PhpStorm configuration

volumes:
  agy_config:
  jb_config:
