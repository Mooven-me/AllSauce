---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - php_var:/app/var
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      MERCURE_EXTRA_DIRECTIVES: playground
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

  vite:
    image: ${IMAGES_PREFIX:-}app-vite-dev
    build:
      context: .
      dockerfile: docker/vite/Dockerfile
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - vite_node_modules:/app/node_modules
    ports:
      - "5173:5173"

  whodb:
    image: clidey/whodb
    restart: unless-stopped
    environment:
      # default configuration to preset the app database and app-test database in whodb
      WHODB_POSTGRES_1: '{"alias":"Dev DB (app)","host":"database","user":"${POSTGRES_USER:-app}","password":"${POSTGRES_PASSWORD:-!ChangeMe!}","database":"${POSTGRES_DB:-app}","port":"5432"}'
      WHODB_POSTGRES_2: '{"alias":"Test DB (app_test)","host":"database","user":"${POSTGRES_USER:-app}","password":"${POSTGRES_PASSWORD:-!ChangeMe!}","database":"${POSTGRES_DB:-app}_test","port":"5432"}'
    ports:
      - "8080:8080"
    depends_on:
      - database

  messenger:
    image: ${IMAGES_PREFIX:-}app-php-dev
    healthcheck:
      disable: true
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      - php_var:/app/var
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      - host.docker.internal:host-gateway
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M", "-vv"]

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

volumes:
  vite_node_modules:
  php_var:
