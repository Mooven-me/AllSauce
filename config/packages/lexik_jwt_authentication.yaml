lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 900
    user_id_claim: sub

    token_extractors:
        cookie:
            enabled: true
            name: BEARER

    set_cookies:
        BEARER:
            lifetime: null
            samesite: lax
            path: /
            domain: null
            secure: false
            httpOnly: true

when@prod:
    lexik_jwt_authentication:
        set_cookies:
            BEARER:
                secure: true
